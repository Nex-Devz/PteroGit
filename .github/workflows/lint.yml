name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src patcher -type f -name "*.php" -print0)

  shellcheck:
    name: Shell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n tests/fixtures/refresh.sh
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          files: install.sh tests/fixtures/refresh.sh

  patcher-idempotency:
    name: Patcher idempotency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Run patcher on fixture
        run: |
          set -e
          # Fresh copy so the fixture in the repo stays pristine (PATCHED then SKIPPED).
          cp -r tests/fixtures/stockpanel /tmp/stockpanel-run
          php patcher/apply.php /tmp/stockpanel-run
          php patcher/apply.php /tmp/stockpanel-run
      - name: Patcher tolerant-whitespace check
        run: |
          set -e
          # Shift the indentation of every stock fixture file; the patcher must
          # still apply every op (no 'anchor not found') and then stay idempotent.
          cp -r tests/fixtures/stockpanel /tmp/fuzzy-run
          find /tmp/fuzzy-run -type f \( -name '*.php' -o -name '*.tsx' -o -name '*.ts' -o -name '*.blade.php' \) \
            -exec sed -i 's/^/  /' {} +
          OUT1="$(php patcher/apply.php /tmp/fuzzy-run 2>&1 || true)"
          if printf '%s' "$OUT1" | grep -q "anchor not found"; then
            echo "tolerant-whitespace run1 failed:"; printf '%s\n' "$OUT1"; exit 1
          fi
          OUT2="$(php patcher/apply.php /tmp/fuzzy-run 2>&1 || true)"
          if printf '%s' "$OUT2" | grep -qE "PATCH|anchor not found"; then
            echo "tolerant-whitespace run2 not idempotent:"; printf '%s\n' "$OUT2"; exit 1
          fi